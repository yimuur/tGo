# ============================================================================
# tGo Docker Compose 模板（Linux / NAS）
#
# 前置条件（镜像不自带引擎与模型）：
#   engine/katago/katago      ← Linux 版 KataGo 可执行文件（不能是 katago.exe）
#   engine/models/*.bin.gz    ← 标准模型；人类模型可选（*human*.bin.gz）
#   engine/katago/analysis.cfg ← 首次启动自动生成，随后持久化在宿主机
#
# 使用：
#   docker load -i tgo-latest.tar.gz  # 导入 tgo:latest（镜像由 Windows 端 tools\docker-build.ps1 构建导出）
#   docker compose up -d
#   浏览器访问 http://<主机 IP>:8090/
#
# 数据与配置全部落在宿主机，容器可随时删除重建：
#   ./config/config.yaml  ← 用户配置（首次启动自动生成）
#   ./data/tgo.db         ← 对局数据库（唯一事实源）
#   ./logs/               ← 运行日志
#   ./engine/             ← 引擎、模型、analysis.cfg（整目录挂载，models 已包含）
#
# 端口：容器内固定 8090。只改对外端口时改 TGO_HTTP_PORT；不要改
# config.yaml 的 server.port（健康检查与内部监听均按 8090）。
# ============================================================================

name: tgo

services:
  tgo:
    image: ${TGO_IMAGE:-tgo}:${TGO_IMAGE_TAG:-latest}
    container_name: ${TGO_CONTAINER_NAME:-tgo}
    restart: unless-stopped
    ports:
      - "${TGO_HTTP_PORT:-8090}:8090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      # KataGo Linux 发行包是 AppImage；容器内无 FUSE，启用 extract-and-run
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # 仅用于容器启动提示（应用内部端口固定 8090）
      TGO_HTTP_PORT: ${TGO_HTTP_PORT:-8090}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      # 整目录挂载：同时覆盖 engine/katago（可执行文件 + analysis.cfg）与
      # engine/models（*.bin.gz）。无需再单独映射 models 子目录。
      - ./engine:/app/engine
      # OpenCL（Intel/AMD）示例：把宿主机的 ICD 配置与厂商驱动挂进容器。
      # 具体 .so 路径随发行版而异，请按宿主机实际位置调整；跨发行版不稳定，
      # NVIDIA 用户建议使用 CUDA 构建 + nvidia-container-toolkit。
      # - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
      # - /usr/lib/x86_64-linux-gnu/libigdrcl.so:/usr/lib/x86_64-linux-gnu/libigdrcl.so:ro
    # ---- GPU 透传（按需取消注释；OpenCL / ROCm / NVIDIA 仅启用一种）----
    # [Intel / AMD OpenCL] 需要宿主机 /dev/dri 与厂商 OpenCL 驱动
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # [AMD ROCm] 宿主机需安装 ROCm（amdgpu 驱动 + 用户态），engine 使用 ROCm 构建。
    # 启用时：取消下面 devices 注释，并在上面的 environment / volumes 中追加：
    #   environment: LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64
    #   volumes:     /opt/rocm:/opt/rocm:ro
    # 可选（按显卡型号）：HSA_OVERRIDE_GFX_VERSION=11.0.0
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    #
    # [NVIDIA CUDA] 需要宿主机安装 nvidia-container-toolkit，
    # 且 engine/katago/katago 为匹配的 CUDA + cuDNN 构建
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
