<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="tgo-board-bg">
  <defs>
    <!-- 浅色模式棋盘底色渐变 (暖木色/云丝纹理) -->
    <linearGradient id="boardBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDCBE"/>
      <stop offset="50%" stop-color="#E6CFA9"/>
      <stop offset="100%" stop-color="#D8BF95"/>
    </linearGradient>

    <!-- 深色模式棋盘底色渐变 (深邃漆木色) -->
    <linearGradient id="boardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="50%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>

    <!-- 水墨山峦渐变：浅色模式 (暖墨) -->
    <linearGradient id="inkLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C2A1E" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#21150A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.00"/>
    </linearGradient>

    <!-- 水墨山峦渐变：深色模式 (冷青墨) -->
    <linearGradient id="inkDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8AB4F8" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#4FACFE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.00"/>
    </linearGradient>

    <!-- 墨滴晕染滤镜 (模糊+高斯拉伸模拟水墨扩散) -->
    <filter id="inkBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    /* 深色主题固定色板（2026/09/13）：由 app.css 按 data-theme 选切本文件（浅色版见 background.svg）。
       ⚠ 四个主题资产一律固定色板、**不使用** prefers-color-scheme——iOS Safari 对 SVG-as-image
       的媒体查询按**系统**（而非应用主题）评估，自适应用法会致「应用浅色 + 系统深色」时浅色
       文件被反色（BUG-068）。 */
    .bg-rect { fill: url(#boardBgDark); }
    .ink-element { fill: url(#inkDark); }
  </style>

  <!-- 1. 全屏适应底色 -->
  <rect class="bg-rect" width="100%" height="100%"/>

  <!-- 2. 画布左侧水墨山峦 (3%~5% 不透明度) -->
  <g class="left-mountains">
    <!-- 远山 -->
    <path class="ink-element" d="
      M -50 1080
      L -50 320
      Q 120 280, 260 410
      T 480 480
      Q 580 520, 640 680
      T 520 1080 Z" />

    <!-- 近山叠影 -->
    <path class="ink-element" d="
      M -50 1080
      L -50 500
      Q 80 450, 180 560
      T 380 620
      Q 460 700, 360 1080 Z" opacity="0.8"/>

    <!-- 左上角墨渍晕染点缀 -->
    <circle class="ink-element" cx="120" cy="180" r="160" filter="url(#inkBlur)"/>
    <circle class="ink-element" cx="320" cy="240" r="90" filter="url(#inkBlur)"/>
  </g>

  <!-- 3. 画布右侧水墨山峦 (镜像对称并做错落处理) -->
  <g class="right-mountains">
    <!-- 远山 -->
    <path class="ink-element" d="
      M 1970 1080
      L 1970 250
      Q 1800 220, 1680 360
      T 1440 450
      Q 1320 520, 1280 720
      T 1420 1080 Z" />

    <!-- 近山叠影 -->
    <path class="ink-element" d="
      M 1970 1080
      L 1970 420
      Q 1820 400, 1720 510
      T 1500 680
      Q 1400 800, 1580 1080 Z" opacity="0.8"/>

    <!-- 右下角墨渍晕染点缀 -->
    <circle class="ink-element" cx="1780" cy="850" r="200" filter="url(#inkBlur)"/>
    <circle class="ink-element" cx="1550" cy="920" r="110" filter="url(#inkBlur)"/>
  </g>

  <!-- 4. 中间保留纯净区域（留白给 19 路围棋盘） -->
  <!-- 视效上棋盘会正好落在 x: 600~1320, y: 140~940 的无干扰空白区域 -->
</svg>
